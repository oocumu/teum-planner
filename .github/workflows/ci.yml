name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'test/**'
              - 'package.json'
            ci:
              - '.github/**'

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    needs: build
    uses: ./.github/workflows/reusable-test.yml
    with:
      os: ${{ github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]' }}
      node: '["20","22"]'
      artifact: dist
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  deploy:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4

  summary:
    needs: [changes, test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 이벤트 | ${{ github.event_name }} |"
            echo "| 브랜치 | ${{ github.ref_name }} |"
            echo "| 앱 코드 변경 | ${{ needs.changes.outputs.app }} |"
            echo "| 테스트 | ${{ needs.test.result }} |"
            echo "| 배포 | ${{ needs.deploy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
