name: Weekly Summary

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceISO = since.toISOString();
            const day = d => d.toISOString().slice(0, 10);

            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', since: sinceISO, per_page: 100,
            });
            const isNew  = i => new Date(i.created_at) >= since;
            const isDone = i => i.closed_at && new Date(i.closed_at) >= since;

            const issues = items.filter(i => !i.pull_request && !i.labels.some(l => l.name === 'weekly-summary'));
            const prs    = items.filter(i => i.pull_request);

            const openedIssues = issues.filter(isNew);
            const closedIssues = issues.filter(isDone);
            const mergedPRs = [];
            for (const p of prs.filter(isDone)) {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: p.number });
              if (data.merged_at) mergedPRs.push(p);
            }
            const breached = issues.filter(i =>
              i.state === 'open' && i.labels.some(l => l.name === 'sla-breached'));

            const commits = await github.paginate(github.rest.repos.listCommits, {
              owner, repo, since: sinceISO, per_page: 100,
            });

            const list = arr => arr.length
              ? arr.map(i => `- #${i.number} ${i.title}`).join('\n')
              : '- 없음';

            const body = [
              `## 주간 요약 (${day(since)} ~ ${day(new Date())})`,
              '',
              '| 항목 | 수 |', '|---|---|',
              `| 새 Issue | ${openedIssues.length} |`,
              `| 닫힌 Issue | ${closedIssues.length} |`,
              `| 병합된 PR | ${mergedPRs.length} |`,
              `| main 커밋 | ${commits.length} |`,
              `| SLA 초과(열림) | ${breached.length} |`,
              '',
              '### 완료된 Issue', list(closedIssues),
              '', '### 병합된 PR', list(mergedPRs),
              '', '### 응답이 필요한 Issue', list(breached),
                          ].join('\n');

            await github.rest.issues.create({
              owner, repo,
              title: `[주간 요약] ${day(since)} ~ ${day(new Date())}`,
              body,
              labels: ['weekly-summary'],
            });
