name: SLA Tracker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write

env:
  SLA_HOURS: 48

jobs:
  check-sla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const slaMs = Number(process.env.SLA_HOURS) * 60 * 60 * 1000;
            const now = Date.now();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const labels = issue.labels.map(l => l.name);
              if (labels.includes('sla-breached')) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number,
              });
              const responded = comments.some(c =>
                c.user.login !== issue.user.login && c.user.type !== 'Bot'
              );
              const age = now - new Date(issue.created_at).getTime();

              if (!responded && age > slaMs) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: ['sla-breached'],
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `첫 응답 목표(${process.env.SLA_HOURS}시간)를 넘겼습니다. 담당자 확인이 필요합니다.`,
                });
                core.info(`#${issue.number} → sla-breached`);
              }
            }
